name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build & publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Build a self-contained, single-file UAssetGUI so end users can preview
      # Unreal .uasset/.umap diffs with zero setup. It's bundled via tauri
      # resources (see src-tauri/resources/uassetgui). UAssetAPI is a git
      # submodule, so --recurse-submodules is required. The project targets
      # net8.0-windows (UAssetGUI v1.1.0, pinned below for reproducibility).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build self-contained UAssetGUI
        shell: pwsh
        env:
          UASSETGUI_REF: v1.1.0
        run: |
          git clone --depth 1 --recurse-submodules --branch $env:UASSETGUI_REF https://github.com/atenfyr/UAssetGUI.git "$env:RUNNER_TEMP\uassetgui-src"
          dotnet publish "$env:RUNNER_TEMP\uassetgui-src\UAssetGUI\UAssetGUI.csproj" `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o "$env:RUNNER_TEMP\uassetgui-out"
          New-Item -ItemType Directory -Force -Path src-tauri\resources\uassetgui | Out-Null
          Copy-Item "$env:RUNNER_TEMP\uassetgui-out\UAssetGUI.exe" src-tauri\resources\uassetgui\UAssetGUI.exe -Force
          if (Test-Path "$env:RUNNER_TEMP\uassetgui-src\LICENSE") {
            Copy-Item "$env:RUNNER_TEMP\uassetgui-src\LICENSE" src-tauri\resources\uassetgui\UAssetGUI-LICENSE.txt -Force
          }

      # Bundle the GitHub CLI so PR Review works without a separate install
      # (see src-tauri/resources/gh). Pinned and checksum-verified.
      - name: Fetch GitHub CLI
        shell: pwsh
        env:
          GH_VERSION: 2.93.0
          GH_SHA256: 77aa01ed7317295ad550de0ad04f3f276b1ef0e9272e3d002ac28dd99853d211
        run: |
          $zip = "$env:RUNNER_TEMP\gh.zip"
          Invoke-WebRequest "https://github.com/cli/cli/releases/download/v$env:GH_VERSION/gh_$($env:GH_VERSION)_windows_amd64.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:GH_SHA256) { throw "gh zip SHA256 mismatch: $hash" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\gh" -Force
          New-Item -ItemType Directory -Force -Path src-tauri\resources\gh | Out-Null
          Copy-Item "$env:RUNNER_TEMP\gh\bin\gh.exe" src-tauri\resources\gh\gh.exe -Force
          Copy-Item "$env:RUNNER_TEMP\gh\LICENSE" src-tauri\resources\gh\gh-LICENSE.txt -Force

      # Use the top section of CHANGELOG.md as the release body. Falls back to a
      # generic line if the file is missing/empty so the build can't break here.
      - name: Extract release notes
        id: notes
        shell: pwsh
        run: |
          $body = "See assets below to download. The auto-updater will pick up the latest release once published."
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^## ') { $start = $i; break } }
            if ($start -ge 0) {
              $end = $lines.Count
              for ($i = $start + 1; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^## ') { $end = $i; break } }
              $section = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
              if ($section.Length -gt 0) { $body = $section }
            }
          }
          "body<<RIFF_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "RIFF_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Riff ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
